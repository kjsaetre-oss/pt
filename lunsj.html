<script>
// Sikkerhetsadapter (sikkerhet-2a-planer-funksjoner.sql): lesing og lagring av
  // movement_plans går via funksjoner som bare gir ut/lagrer ÉN kundes plan.
  // Mangler funksjonene, eller noe feiler, brukes den gamle direkte måten.
  window.tlSecurePlans = window.tlSecurePlans || function (client) {
    if (!client || client.__tlSecurePlans) return client;
    var direct = client.from.bind(client);
    var rpc = client.rpc.bind(client);
    var idOk = function (v) { return /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i.test(String(v || "")); };
    function pick(row, cols) {
      var c = String(cols || "*").split(",").map(function (s) { return s.trim(); }).filter(Boolean);
      if (!c.length || c.indexOf("*") >= 0) return row;
      var out = {}; c.forEach(function (k) { out[k] = row[k]; }); return out;
    }
    function select(cols) {
      var filters = [];
      function run(mode) {
        var id = filters.length === 1 && filters[0][0] === "member_id" ? filters[0][1] : null;
        var viaDirect = function () {
          var q = direct("movement_plans").select(cols);
          filters.forEach(function (f) { q = q.eq(f[0], f[1]); });
          return mode === "maybe" ? q.maybeSingle() : mode === "single" ? q.single() : q;
        };
        if (!idOk(id)) return viaDirect();
        return rpc("tl_plan_get", { p_member_id: String(id) }).then(function (r) {
          if (r.error) { console.warn("tl_plan_get feilet – bruker gammel måte:", r.error.message || r.error); return viaDirect(); }
          var row = r.data ? pick(r.data, cols) : null;
          if (mode === "list") return { data: row ? [row] : [], error: null };
          if (mode === "single" && !row) return { data: null, error: { message: "Ingen rad" } };
          return { data: row, error: null };
        }, function () { return viaDirect(); });
      }
      var b = {
        eq: function (c, v) { filters.push([c, v]); return b; },
        maybeSingle: function () { return run("maybe"); },
        single: function () { return run("single"); },
        then: function (res, rej) { return run("list").then(res, rej); }
      };
      return b;
    }
    function upsert(payload, opts) {
      var p = Array.isArray(payload) ? null : payload;
      var viaDirect = function () { return direct("movement_plans").upsert(payload, opts); };
      if (!p || !idOk(p.member_id) || !p.state_json) return viaDirect();
      var state = typeof p.state_json === "string" ? JSON.parse(p.state_json) : p.state_json;
      return rpc("tl_plan_save", { p_member_id: String(p.member_id), p_member_name: p.member_name || "", p_state_json: state, p_updated_at: p.updated_at || null })
        .then(function (r) {
          if (r.error) { console.warn("tl_plan_save feilet – bruker gammel måte:", r.error.message || r.error); return viaDirect(); }
          return { data: null, error: null };
        }, function () { return viaDirect(); });
    }
    return new Proxy(client, {
      get: function (t, k) {
        if (k === "__tlSecurePlans") return true;
        if (k === "from") return function (table) { return table === "movement_plans" ? { select: select, upsert: upsert } : direct(table); };
        var v = t[k];
        return typeof v === "function" ? v.bind(t) : v;
      }
    });

    steps: [
      { title: "Stek potetkrønsj", text: "Stek revet rå potet i en panne på middels varme til den blir gyllen og sprø. Krydre med havsalt og sort pepper. La potetraspet renne av på kjøkkenpapir over en rist mens det stekes for ekstra sprøhet - dette tar litt tid." },
      { title: "Rør sammen dressingen", text: "Bland hvitløk, plantebasert yoghurt, sitronsaft, havsalt og pepper. Hell dressingen i en liten skål som settes midt på salatfatet." },
      { title: "Dander salaten", text: "Legg de øvrige salatingrediensene i hver sin sone rundt dressingskålen. Sett salaten kaldt før servering." },

    servings: 4,
    ingredients: [
      { amount: 1, unit: null, name: "liten squash", group: "Ingredienser" },
      { amount: 0.25, unit: "glass", name: "grønn pesto", group: "Ingredienser" },
      { amount: 1, unit: "håndfull", name: "rukkola", group: "Ingredienser" },
      { amount: 4, unit: "stk", name: "cherrytomater, delt i to", group: "Ingredienser" },
      { amount: 0.25, unit: null, name: "økologisk sitron (skall/zest)", group: "Ingredienser" },
      { amount: null, unit: null, name: "parmesan, skåret i skiver", group: "Ingredienser" },
      { amount: null, unit: null, name: "sort kvernet pepper etter smak", group: "Ingredienser" },

    steps: [
      { title: "Lag squashnudler", text: "Vask squashen og kjør den gjennom en spiralkutter eller mandolin slik at den blir til nudler." },
      { title: "Klargjør rukkola", text: "Vask rukkolaen og tørk den godt, enten i salatslynge eller med tørkepapir." },
      { title: "Rør inn pesto", text: "Bruk hjemmelaget eller kjøpt (helst økologisk) pesto og rør den inn i squashnudlene." },
      { title: "Sett sammen retten", text: "Legg rukkola i bunnen av tallerkenen og fordel squashnudlene med pesto over. Topp med cherrytomater, biter av parmesan og sitronskall." },
      { title: "Avslutt og server", text: "Kvern over sort pepper og server retten sammen med grovt brød eller knekkebrød og smør." },

      const FOCUS_LABELS = { lavkarbo: "Lavkarbo", vanlig: "Hverdagskost", glutenfri: "Glutenfri" };

      function escapeHtml(str){
        return String(str).replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;");
      }

      function formatIngredient(ing, scale){
        if(ing.amount == null) return ing.name.charAt(0).toUpperCase() + ing.name.slice(1);
        const scaledAmount = scale ? Math.round(ing.amount * scale * 100) / 100 : ing.amount;
        const amt = String(scaledAmount).replace(".", ",");
        return ing.unit ? `${amt} ${ing.unit} ${ing.name}` : `${amt} ${ing.name}`;
      }

      function toDateValue(date){
        const y = date.getFullYear();
        const m = String(date.getMonth() + 1).padStart(2, "0");
        const d = String(date.getDate()).padStart(2, "0");
        return `${y}-${m}-${d}`;
      }
      function parseDateValue(value){
        if(!value) return null;
        const [y, m, d] = value.split("-").map(Number);
        return new Date(y, m - 1, d);
      }

      // ---- Søk + filter + liste ----
      let currentFocusFilter = "alle";
      // ── Mine favoritter: oppskrifter kunden har gitt 4–5 stjerner (recipe_ratings) ──
      const MY_RATINGS = new Map(); // recipeId -> stjerner
      function loadMyRatings(after){
        const m = (window.MVT_memberData || {});
        if (!m.id) return;
        fetch(SUPABASE_URL + "/rest/v1/rpc/tl_ratings_mine", {
      method: "POST", body: JSON.stringify({ p_member_id: m.id }),
      headers: { apikey: SUPABASE_ANON_KEY, Authorization: "Bearer " + SUPABASE_ANON_KEY, "Content-Type": "application/json" }
        }).then(r => r.ok ? r.json() : null).then(rows => {
          if (!Array.isArray(rows)) return;
          MY_RATINGS.clear(); rows.forEach(x => MY_RATINGS.set(x.recipe_id, Number(x.stars) || 0));
          if (after) after();
        }).catch(() => {});
      }
      function isFavorite(id){ return (MY_RATINGS.get(id) || 0) >= 4; }


      function renderRecipeList(){
        const term = document.getElementById("searchInput").value.trim().toLowerCase();
        let pool = currentFocusFilter === "favoritter"
          ? MENU_RECIPES.filter(r => isFavorite(r.id)).sort((a, b) => (MY_RATINGS.get(b.id) || 0) - (MY_RATINGS.get(a.id) || 0))
          : MENU_RECIPES.filter(r => currentFocusFilter === "alle" || r.focus === currentFocusFilter);
        if(term) pool = pool.filter(r => r.title.toLowerCase().includes(term));

        const listEl = document.getElementById("recipeList");
        if(!pool.length){
          listEl.innerHTML = currentFocusFilter === "favoritter" && !term
            ? `<p class="sok-empty">Ingen favoritter ennå. Gi en oppskrift 4 eller 5 stjerner, så dukker den opp her.</p>`
            : `<p class="sok-empty">Fant ingen oppskrifter som matcher søket.</p>`;
          return;
        }
        listEl.innerHTML = pool.map(r =>
          `<button class="sok-row" type="button" data-recipe-id="${escapeHtml(r.id)}">
            <span class="sok-row-thumb"><img src="${escapeHtml(r.image)}" alt="" loading="lazy" /></span>
            <span class="sok-row-main">
              <span class="sok-row-title">${escapeHtml(r.title)}${isFavorite(r.id) ? " ❤️" : ""}</span>
              <span class="sok-row-focus-tag tag-${r.focus}">${escapeHtml(FOCUS_LABELS[r.focus] || r.focus)}</span>
            </span>
            <span class="sok-row-arrow">→</span>
          </button>`
        ).join("");
        listEl.querySelectorAll(".sok-row").forEach(btn => {
          btn.addEventListener("click", () => openRecipeModal(btn.dataset.recipeId));
        });
      }

      document.getElementById("searchInput").addEventListener("input", renderRecipeList);
      loadMyRatings(renderRecipeList);
      document.querySelectorAll(".sok-filter-chip").forEach(chip => {
        chip.addEventListener("click", () => {
          currentFocusFilter = chip.dataset.focus;
          if (currentFocusFilter === "favoritter") loadMyRatings(renderRecipeList);
          document.querySelectorAll(".sok-filter-chip").forEach(c => c.classList.toggle("active", c === chip));
          const searchInput = document.getElementById("searchInput");
          searchInput.placeholder = currentFocusFilter === "alle"
            ? "Søk blant alle oppskriftene …"
            : `Søk i ${FOCUS_LABELS[currentFocusFilter] || chip.textContent} etter …`;
          renderRecipeList();
        });
      });

      // ---- Oppskrift-modal ----
      let activeRecipe = null;
      let activeServings = 4;

      function groupIngredientsByComponent(ingredients){
        const groups = [];
        const byName = new Map();
        ingredients.forEach(ing => {
          const groupName = ing.group || "Ingredienser";
          if(!byName.has(groupName)){
            byName.set(groupName, { group: groupName, items: [] });
            groups.push(byName.get(groupName));
          }
          byName.get(groupName).items.push(ing);
        });
        return groups;
      }

      function renderRmodIngredients(){
        if(!activeRecipe) return;
        const baseServings = activeRecipe.servings || 4;
        const scale = activeServings / baseServings;
        document.getElementById("rmod-servings-count").textContent = activeServings;
        document.getElementById("rmod-servings-minus").disabled = activeServings <= 1;
        const groups = groupIngredientsByComponent(activeRecipe.ingredients);
        const showHeaders = groups.length > 1;
        document.getElementById("rmod-ingredients").innerHTML = groups.map(g =>
          (showHeaders ? `<div class="rmod-ingredient-group-title">${escapeHtml(g.group)}</div>` : "") +
          g.items.map(ing => `<div class="rmod-ingredient">${escapeHtml(formatIngredient(ing, scale))}</div>`).join("")
        ).join("");
      }
      document.getElementById("rmod-servings-minus").addEventListener("click", () => {
        if(activeServings <= 1) return;
        activeServings--;
        renderRmodIngredients();
      });
      document.getElementById("rmod-servings-plus").addEventListener("click", () => {
        if(activeServings >= 24) return;
        activeServings++;
        renderRmodIngredients();
      });

      async function loadRecipeRatingSummary(recipeId){
        try{
          const client = await withTimeout(getSupabaseClient(), 15000);
          const { data, error } = await withTimeout(client
            .rpc("tl_rating_rows", { p_recipe_id: recipeId, p_member_id: getMovementMember().id || "" }), 15000);
          if(error) throw error;
          const rows = data || [];
          const count = rows.length;
          const average = count ? rows.reduce((sum, r) => sum + r.stars, 0) / count : 0;
          const member = getMovementMember();
          const mine = member.id ? rows.find(r => r.member_id === member.id) : null;
          return { average, count, myStars: mine ? mine.stars : 0, failed: false };
        }catch(e){
          console.warn("Kunne ikke hente stjernevurderinger.", e);
          return { average: 0, count: 0, myStars: 0, failed: true };
        }
      }

      async function submitRecipeRating(recipeId, stars){
        const member = getMovementMember();
        if(!member.id) return false;
        try{
          const client = await withTimeout(getSupabaseClient(), 15000);
          const { error } = await withTimeout(client
            .rpc("tl_rating_save", { p_member_id: member.id, p_member_name: member.name || "", p_recipe_id: recipeId, p_stars: stars }), 15000);
          if(error) throw error;
          MY_RATINGS.set(recipeId, stars);
          return true;
        }catch(e){
          console.warn("Kunne ikke lagre stjernevurdering.", e);
          return false;
        }
      }

      function renderRatingStars(recipeId, summary){
        const container = document.getElementById("rmod-rating");
        const myStars = summary.myStars || 0;
        container.innerHTML =
          `<div class="rmod-rating-stars">${[1,2,3,4,5].map(n =>
            `<button type="button" class="rmod-rating-star${n <= myStars ? " filled" : ""}" data-star="${n}" aria-label="Gi ${n} stjerne${n === 1 ? "" : "r"}">★</button>`
          ).join("")}</div>` +
          `<span class="rmod-rating-summary">${summary.count ? `${summary.average.toFixed(1)} ★ (${summary.count} vurdering${summary.count === 1 ? "" : "er"})` : "Ingen vurderinger ennå"}</span>` +
      `<button type="button" class="rmod-rating-fav${myStars >= 4 ? " on" : ""}" aria-pressed="${myStars >= 4}">${myStars >= 4 ? "\u2665 Favoritt" : "\u2661 Legg til favoritter"}</button>`;
        // Favoritt = 4–5 stjerner (samme som «Mine favoritter» og byttelista).
        // Hjertet gir 5 stjerner; fjernes det, settes 3 (nøytral, ikke «liker ikke»).
        const favBtn = container.querySelector(".rmod-rating-fav");
        if (favBtn) favBtn.addEventListener("click", async () => {
          if (!getMovementMember().id) {
            container.querySelector(".rmod-rating-summary").textContent = "Åpne siden fra appen for å lagre favoritter.";
            return;
          }
          favBtn.disabled = true;
          const ok = await submitRecipeRating(recipeId, myStars >= 4 ? 3 : 5);
          if (ok) {
            const fresh = await loadRecipeRatingSummary(recipeId);
            renderRatingStars(recipeId, fresh);
          } else {
            favBtn.disabled = false;
          }
        });
        container.querySelectorAll(".rmod-rating-star").forEach(btn => {
          btn.addEventListener("click", async () => {
            const stars = Number(btn.dataset.star);
            if(!getMovementMember().id){
              container.querySelector(".rmod-rating-summary").textContent = "Åpne siden fra appen for å gi stjerner.";
              return;
            }
            const ok = await submitRecipeRating(recipeId, stars);
            if(ok){
              const fresh = await loadRecipeRatingSummary(recipeId);
              renderRatingStars(recipeId, fresh);
            }
          });
        });
      }

      function openRecipeModal(recipeId){
        const recipe = MENU_RECIPES.find(r => r.id === recipeId);
        if(!recipe) return;
        activeRecipe = recipe;
        activeServings = recipe.servings || 4;
        document.getElementById("rmod-title").textContent = recipe.title;
        document.getElementById("rmod-rating").innerHTML = "";
        loadRecipeRatingSummary(recipeId).then(summary => renderRatingStars(recipeId, summary));
        renderRmodIngredients();
        document.getElementById("rmod-steps").innerHTML = recipe.steps.map((step, i) =>
          `<div class="rmod-step"><div class="rmod-step-num">${i + 1}</div><div><p class="rmod-step-title">${escapeHtml(step.title)}</p><p class="rmod-step-text">${escapeHtml(step.text)}</p></div></div>`
        ).join("");

        const todayValue = toDateValue(new Date());
        const dateInput = document.getElementById("addDateInput");
        dateInput.min = todayValue;
        dateInput.value = todayValue;
        const statusEl = document.getElementById("addStatus");
        statusEl.textContent = "";
        statusEl.className = "tbsa-status";
        const addBtn = document.getElementById("addToDayBtn");
        addBtn.disabled = false;
        addBtn.textContent = "Legg til denne dagen";

        document.getElementById("rmod").classList.add("show");
      }
      function closeRecipeModal(){ document.getElementById("rmod").classList.remove("show"); }
      document.getElementById("rmod-close").addEventListener("click", closeRecipeModal);
      document.getElementById("rmod").addEventListener("click", (e) => {
        if(e.target === document.getElementById("rmod")) closeRecipeModal();
      });

      // ============================================================
      // Legg retten til på valgt dato: leser member sin movement_plans-rad,
      // finner HVILKEN allerede lagrede meny (assignedLunches-oppføring) som
      // dekker den valgte datoen, og bytter inn retten på riktig dag der.
      // Samme les-endre-skriv-mønster som min-meny.html sin lagring.
      // ============================================================
      async function addRecipeToDay(recipeId, dateValue, servings){
        const member = getMovementMember();
        if(!member.id) return { ok:false, reason:"no-member" };

        try{
          const client = await withTimeout(getSupabaseClient(), 15000);
          const { data: row, error: loadError } = await withTimeout(client
            .from("movement_plans")
            .select("state_json")
            .eq("member_id", member.id)
            .maybeSingle(), 15000);
          if(loadError) throw loadError;

          const existing = row && row.state_json
            ? (typeof row.state_json === "string" ? JSON.parse(row.state_json) : row.state_json)
            : {};

          const assignedLunches = Array.isArray(existing.assignedLunches) ? existing.assignedLunches.slice() : [];

          const targetDate = parseDateValue(dateValue);
          let targetMeal = null;
          let targetIndex = -1;
          for(const meal of assignedLunches){
            const start = parseDateValue(meal.startDate);
            const totalDays = Number(meal.totalDays) || 0;
            if(!start || !totalDays) continue;
            const diffDays = Math.round((targetDate - start) / (24 * 60 * 60 * 1000));
            if(diffDays >= 0 && diffDays < totalDays){
              targetMeal = meal;
              targetIndex = diffDays;
              break;
            }
          }

          // Ingen eksisterende meny dekker denne datoen — enten har kunden
          // ingen meny ennå, eller menyen dekker ikke akkurat denne dagen.
          // I stedet for å kreve at kunden bygger en hel meny først (i
          // min-meny.html), lager vi en liten egen ett-dags "meny" for
          // akkurat denne datoen. Den lever fint side om side med en ordentlig
          // meny — vanekalender.html rendrer hver assignedLunches-oppføring
          // uavhengig av de andre, se rebuildVirtualMealItemsFromState().
          if(!targetMeal){
            const recipe = MENU_RECIPES.find(r => r.id === recipeId);
            targetMeal = {
              id: "enkeltrett-lunsj-" + dateValue,
              focus: recipe ? recipe.focus : "vanlig",
              startDate: dateValue,
              totalDays: 1,
              servings: servings || 4,
              servingsAdults: servings || 4,
              servingsChildren: 0,
              dayMeals: []
            };
            assignedLunches.push(targetMeal);
            targetIndex = 0;
          }

          if(!Array.isArray(targetMeal.dayMeals)) targetMeal.dayMeals = [];
          targetMeal.dayMeals[targetIndex] = { recipeId };

          // ATOMISK skriving (fikset 2026-09-17) — se
          // movement-plans-atomic-list-rpc.sql i prosjektroten og samme fiks
          // i sok-oppskrifter.html for full forklaring.
          const { data: nextStateJson, error: saveError } = await withTimeout(client
            .rpc("upsert_movement_plan_list_item", {
              p_member_id: member.id,
              p_member_name: member.name || "",
              p_field: "assignedLunches",
              p_item: targetMeal
            }), 15000);
          if(saveError) throw saveError;

          return { ok:true, stateJson: nextStateJson };
        }catch(e){
          console.warn("Kunne ikke legge til retten på valgt dag.", e);
          return { ok:false, reason:"error", error:e };
        }
      }

      document.getElementById("addToDayBtn").addEventListener("click", async () => {
        if(!activeRecipe) return;
        const dateValue = document.getElementById("addDateInput").value;
        if(!dateValue) return;

        const btn = document.getElementById("addToDayBtn");
        const statusEl = document.getElementById("addStatus");
        btn.disabled = true;
        btn.textContent = "Legger til …";

        const result = await addRecipeToDay(activeRecipe.id, dateValue, activeServings);

        btn.disabled = false;
        btn.textContent = "Legg til denne dagen";
        statusEl.classList.remove("ok", "warn");

        if(result.ok){
          statusEl.classList.add("ok", "show");
          statusEl.textContent = "✓ Lagt til! Du blir sendt til vanekalenderen om noen sekunder ...";
          setTimeout(() => {
            window.location.href = "index.html" + (window.TL_PT_HASH || "");
          }, 3000);
        } else if(result.reason === "no-member"){
          statusEl.classList.add("warn", "show");
          statusEl.textContent = "Fant ingen kundeprofil å lagre på. Åpne denne siden fra Tro&Livsstil-appen.";
        } else {
          statusEl.classList.add("warn", "show");
          statusEl.textContent = "Kunne ikke lagre akkurat nå. Prøv igjen om litt.";
        }
      });


      // ── Egne oppskrifter fra Supabase (tabell tl_recipes) ────────────────
      // Oppskriftene over ligger fast i siden. Nye oppskrifter (og endringer med
      // samme id) hentes fra Supabase og flettes inn; active=false skjuler.
      // Siste svar huskes i nettleseren, så de vises også før nettet svarer.
      const RECIPE_CACHE_KEY = "tl_recipes_v1";
      function mergeSharedRecipes(target, rows, kinds) {
        let changed = false;
        (rows || []).filter(r => kinds.includes(r.kind)).forEach(r => {
          const i = target.findIndex(x => x.id === r.id);
          if (r.active === false) { if (i >= 0) { target.splice(i, 1); changed = true; } return; }
          const rec = { id: r.id, image: r.image || "", focus: r.focus || "vanlig", protein: r.protein || "vegetar", title: r.title, servings: r.servings || 2, ingredients: Array.isArray(r.ingredients) ? r.ingredients : [], steps: Array.isArray(r.steps) ? r.steps : [] };
          if (i >= 0) target[i] = rec; else target.push(rec);
          changed = true;
        });
        return changed;
      }
      function loadSharedRecipes(apply) {
        try { const cached = JSON.parse(localStorage.getItem(RECIPE_CACHE_KEY) || "null"); if (Array.isArray(cached)) apply(cached); } catch (e) {}
        fetch(SUPABASE_URL + "/rest/v1/tl_recipes?select=id,kind,title,focus,protein,servings,image,ingredients,steps,active&order=created_at", {
          headers: { apikey: SUPABASE_ANON_KEY, Authorization: "Bearer " + SUPABASE_ANON_KEY }
        })
          .then(res => res.ok ? res.json() : null)
          .then(rows => {
            if (!Array.isArray(rows)) return;
            try { localStorage.setItem(RECIPE_CACHE_KEY, JSON.stringify(rows)); } catch (e) {}
            apply(rows);
          })
          .catch(() => {});
      }
      loadSharedRecipes(rows => { if (mergeSharedRecipes(MENU_RECIPES, rows, ["lunsj"])) { try { renderRecipeList(); } catch (e) {} } });

      renderRecipeList();

      // Dyplenke fra globalt søkefelt: ?open=<oppskrift-id> åpner oppskriften direkte
      const deepLinkRecipeId = new URLSearchParams(window.location.search).get("open");
      if(deepLinkRecipeId && MENU_RECIPES.some(r => r.id === deepLinkRecipeId)) openRecipeModal(deepLinkRecipeId);
    })();
  </script>
<script>
/* Vakthund (samme idé som i vanekalenderen): movement.os kan bytte ut sidens
   innhold etter at skriptene har kjørt. Da ligger en ny kopi av skriptene her
   som aldri har startet, og siden står tom til kunden laster på nytt. Vakten
   finner nye skript merket data-tl-widget="sok-oppskrifter-lunsj" som ikke har kjørt, og
   starter dem. Kjører nettleseren sidens skript på vanlig måte, tar den nye vakten over. */
(function () {
  var KEY = "sok-oppskrifter-lunsj";
  var counterKey = "__tlWatch_" + KEY;
  var me = (window[counterKey] = (window[counterKey] || 0) + 1);
  var sel = 'script[data-tl-widget="' + KEY + '"]';
  // Husker selve skript-elementene som har kjørt (ikke et merke i HTML-en,
  // som kan bli med når innholdet kopieres).
  var known = new WeakSet();
  document.querySelectorAll(sel).forEach(function (s) { known.add(s); });
  var timer = setInterval(function () {
    if (window[counterKey] !== me) { clearInterval(timer); return; }
    var fresh = Array.prototype.filter.call(document.querySelectorAll(sel), function (s) { return !known.has(s); });
    if (!fresh.length) return;
    console.info("Tro & Livsstil (" + KEY + "): innholdet ble byttet ut – starter på nytt.");
    var ran = {};
    fresh.forEach(function (orig) {
      known.add(orig);
      var code = orig.textContent;
      if (ran[code]) return; // samme skript to ganger (kopi av kopi) – kjør én gang
      ran[code] = true;
      var again = document.createElement("script");
      again.setAttribute("data-tl-widget", KEY);
      known.add(again);
      again.textContent = code;
      orig.parentNode.insertBefore(again, orig.nextSibling);
    });
  }, 700);
})();
</script>
